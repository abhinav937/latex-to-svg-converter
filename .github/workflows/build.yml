name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-Windows
        path: LaTeX-SVG-Converter-Windows.zip

  build-macos:
    runs-on: macos-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-macOS
        path: LaTeX-SVG-Converter-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-Linux
        path: dist/latex_svg_converter

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'release'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Prepare Linux asset
      run: |
        cd LaTeX-SVG-Converter-Linux
        tar -czf latex_svg_converter-linux.tar.gz latex_svg_converter/

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'release' && github.event.release.tag_name || format('build-{0}', github.run_number) }}
        name: ${{ github.event_name == 'release' && github.event.release.name || format("Build #{0}", github.run_number) }}
        body: ${{ github.event_name == 'release' && github.event.release.body || 'Automated build artifacts' }}
        draft: ${{ github.event_name == 'push' }}
        prerelease: ${{ github.event_name == 'push' }}
        files: |
          LaTeX-SVG-Converter-Windows/LaTeX-SVG-Converter-Windows.zip
          LaTeX-SVG-Converter-macOS/LaTeX-SVG-Converter-macOS.dmg
          LaTeX-SVG-Converter-Linux/latex_svg_converter-linux.tar.gz
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

