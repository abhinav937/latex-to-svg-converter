name: Build and Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-Windows
        path: LaTeX-SVG-Converter-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-macOS
        path: LaTeX-SVG-Converter-macOS.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
        python -m pip install --upgrade pip
        pip install pyinstaller PySide6
    - name: Build executable
      run: python build.py
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: LaTeX-SVG-Converter-Linux
        path: dist/latex_svg_converter

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          LaTeX-SVG-Converter-Windows/LaTeX-SVG-Converter-Windows.zip
          LaTeX-SVG-Converter-macOS/LaTeX-SVG-Converter-macOS.dmg
          LaTeX-SVG-Converter-Linux/latex_svg_converter
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

